<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#100e0b" />
    <meta name="description" content="Ibrahim Lens — portraits and fashion photography across Nigeria." />
    <title>Ibrahim Lens</title>

    <!--
      Baseline share metadata. WhatsApp, Instagram, and Facebook unfurlers do not
      run JavaScript, so anything applied at runtime is invisible to them; these
      static tags are what a shared link actually shows. Per-page values are
      still applied client-side for the browser.
    -->
    <link rel="canonical" href="{{SITE_URL}}/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ibrahim Lens" />
    <meta property="og:title" content="Ibrahim Lens" />
    <meta
      property="og:description"
      content="Ibrahim Lens — portraits and fashion photography across Nigeria."
    />
    <meta property="og:url" content="{{SITE_URL}}/" />
    <meta property="og:image" content="{{SITE_URL}}{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Photography by Ibrahim Lens" />
    <meta property="og:locale" content="en_NG" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ibrahim Lens" />
    <meta
      name="twitter:description"
      content="Ibrahim Lens — portraits and fashion photography across Nigeria."
    />
    <script type="application/ld+json" src="/photographer.jsonld"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
